<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미국 M2 통화량 (2015-2025)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .chart-container {
            position: relative;
            height: 500px;
            margin-bottom: 20px;
        }
        .info-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .info-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }
        .info-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .info-card p {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>지난 10년간 미국 M2통화량 추이</h1>
        <div class="subtitle">2015년 ~ 2025년 (단위: 조 달러)</div>
        
        <div class="chart-container">
            <canvas id="m2Chart"></canvas>
        </div>
        
        <div class="info-box">
            <div class="info-card">
                <h3>2015년 1월</h3>
                <p>$11.7T</p>
            </div>
            <div class="info-card">
                <h3>2020년 3월 (팬데믹 전)</h3>
                <p>$15.4T</p>
            </div>
            <div class="info-card">
                <h3>2022년 4월 (최고점)</h3>
                <p>$21.8T</p>
            </div>
            <div class="info-card">
                <h3>2025년 9월 (최근)</h3>
                <p>$22.2T</p>
            </div>
        </div>
    </div>

    <script>
        // 미국 M2 통화량 데이터 (2015-2025, 조 달러)
        const data = {
            labels: [
                '2015', '2016', '2017', '2018', '2019', '2020',
                '2021', '2022', '2023', '2024', '2025'
            ],
            datasets: [{
                label: 'M2 통화량 (조 달러)',
                data: [
                    11.9, 12.6, 13.4, 14.0, 14.7, 16.7,
                    20.0, 21.6, 20.9, 21.1, 22.0
                ],
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointHoverRadius: 6,
                pointBackgroundColor: '#667eea',
                pointBorderColor: '#fff',
                pointBorderWidth: 2
            }]
        };

        const config = {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#333'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 12,
                        titleFont: {
                            size: 14
                        },
                        bodyFont: {
                            size: 13
                        },
                        callbacks: {
                            label: function(context) {
                                return ' M2: $' + context.parsed.y.toFixed(1) + '조';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 10,
                        max: 23,
                        ticks: {
                            callback: function(value) {
                                return '$' + value + 'T';
                            },
                            font: {
                                size: 12
                            },
                            color: '#666'
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        title: {
                            display: true,
                            text: 'M2 통화량 (조 달러)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#333'
                        }
                    },
                    x: {
                        ticks: {
                            maxRotation: 0,
                            minRotation: 0,
                            font: {
                                size: 12
                            },
                            color: '#666'
                        },
                        grid: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: '기간',
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#333'
                        }
                    }
                },
                interaction: {
                    intersect: false,
                    mode: 'index'
                }
            }
        };

        const ctx = document.getElementById('m2Chart').getContext('2d');
        new Chart(ctx, config);
    </script>
</body>
</html>
