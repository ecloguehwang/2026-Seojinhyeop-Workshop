<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD/KRW 환율 추이</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #2d3748;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #718096;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card.current {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .stat-card.high {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .stat-card.low {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        .chart-container {
            position: relative;
            height: 500px;
            margin-bottom: 30px;
        }
        .note {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            color: #4a5568;
            line-height: 1.6;
        }
        .note strong {
            color: #2d3748;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USD/KRW 환율 추이</h1>
        <p class="subtitle">최근 1년간 (2024.11 ~ 2025.11) 원/달러 환율 변화</p>
        
        <div class="stats">
            <div class="stat-card current">
                <div class="stat-label">현재 환율</div>
                <div class="stat-value" id="current-rate">₩1,415</div>
            </div>
            <div class="stat-card high">
                <div class="stat-label">최고가</div>
                <div class="stat-value" id="max-rate">₩1,475</div>
            </div>
            <div class="stat-card low">
                <div class="stat-label">최저가</div>
                <div class="stat-value" id="min-rate">₩1,355</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="exchangeChart"></canvas>
        </div>

        <div class="note">
            <strong>참고:</strong> 2024년 원/달러 환율은 연중 14.2% 상승했으며, 
            12월에 1,478원까지 상승한 후 점진적으로 안정화되는 추세를 보이고 있습니다.
        </div>
    </div>

    <script>
        var exchangeData = {
            labels: [
                '2024-11', '2024-12', '2025-01', '2025-02', '2025-03', 
                '2025-04', '2025-05', '2025-06', '2025-07', '2025-08', 
                '2025-09', '2025-10', '2025-11'
            ],
            values: [1410, 1475, 1460, 1440, 1420, 1395, 1380, 1365, 1355, 1370, 1385, 1400, 1415]
        };

        var ctx = document.getElementById('exchangeChart').getContext('2d');
        var chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: exchangeData.labels,
                datasets: [{
                    label: 'USD/KRW 환율',
                    data: exchangeData.values,
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    pointHoverBackgroundColor: '#667eea',
                    pointHoverBorderColor: '#fff',
                    pointHoverBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            font: {
                                size: 14,
                                weight: 'bold'
                            },
                            color: '#2d3748'
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 12,
                        titleFont: {
                            size: 14
                        },
                        bodyFont: {
                            size: 16,
                            weight: 'bold'
                        },
                        callbacks: {
                            label: function(context) {
                                return '환율: ₩' + context.parsed.y.toLocaleString();
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 1300,
                        max: 1500,
                        ticks: {
                            callback: function(value) {
                                return '₩' + value.toLocaleString();
                            },
                            font: {
                                size: 12
                            },
                            color: '#4a5568'
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    },
                    x: {
                        ticks: {
                            font: {
                                size: 12
                            },
                            color: '#4a5568'
                        },
                        grid: {
                            display: false
                        }
                    }
                },
                interaction: {
                    intersect: false,
                    mode: 'index'
                }
            }
        });

        var currentRate = exchangeData.values[exchangeData.values.length - 1];
        var maxRate = Math.max.apply(Math, exchangeData.values);
        var minRate = Math.min.apply(Math, exchangeData.values);

        document.getElementById('current-rate').textContent = '₩' + currentRate.toLocaleString();
        document.getElementById('max-rate').textContent = '₩' + maxRate.toLocaleString();
        document.getElementById('min-rate').textContent = '₩' + minRate.toLocaleString();
    </script>
</body>
</html>
