<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학별 학과 취업률</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .copyright {
            text-align: right;
            color: #000;
            font-size: 0.9em;
            margin-top: 30px;
            padding: 10px 0;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .chart-wrapper {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        canvas {
            max-height: 400px;
        }

        @media (max-width: 968px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 대학별 학과 취업률</h1>
        <p class="subtitle">자료: 2024년 대학 취업률 데이터</p>

        <div class="controls">
            <div class="control-group">
                <label for="regionFilter">지역 선택</label>
                <select id="regionFilter">
                    <option value="all">전체 지역</option>
                </select>
            </div>
            <div class="control-group">
                <label for="majorFilter">계열 선택</label>
                <select id="majorFilter">
                    <option value="all">전체 계열</option>
                </select>
            </div>
            <div class="control-group">
                <label for="universityFilter">대학 선택</label>
                <select id="universityFilter">
                    <option value="all">전체 대학</option>
                </select>
            </div>
            <div class="control-group">
                <label for="departmentFilter">학과 선택</label>
                <select id="departmentFilter">
                    <option value="all">전체 학과</option>
                </select>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">평균 취업률</div>
                <div class="stat-value" id="avgRate">0%</div>
            </div>
            <div class="stat-card">

                <div class="stat-value" id="maxRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최저 취업률</div>
                <div class="stat-value" id="minRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">분석 학과 수</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-wrapper">
                <div class="chart-title">계열별 평균 취업률</div>
                <canvas id="majorChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title">지역별 평균 취업률</div>
                <canvas id="regionChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title">대학별 평균 취업률</div>
                <canvas id="universityChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <div class="chart-title">학과별 평균 취업률</div>
                <canvas id="departmentChart"></canvas>
            </div>
        </div>

        <div class="copyright">
            CC BY 황성삼(은평고), 자료정리: 정태영
        </div>
    </div>

        let fullData = [];
        let currentData = [];
        let majorChart, regionChart, universityChart, departmentChart;

        // CSV 파싱
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                let values;
                // 탭이 있으면 탭으로, 없으면 여러 공백으로 구분
                if (lines[i].includes('\t')) {
                    values = lines[i].split('\t');
                } else {
                    // 여러 공백을 하나로 처리
                    values = lines[i].split(/\s{2,}/);
                }
                
                // 값 정리 (앞뒤 공백 제거)
                values = values.map(v => v.trim()).filter(v => v.length > 0);
                
                if (values.length >= 6) {
                    const rate = parseFloat(values[5]);
                    if (!isNaN(rate)) {
                        data.push({
                            계열: values[0],
                            지역: values[1],
                            학교명: values[2],
                            연도구분: values[3],
                            학과: values[4],
                            취업률: rate
                        });
                    }
                }
            }
            return data;
        }

        // 필터 초기화
        function initializeFilters() {
            const regions = [...new Set(fullData.map(d => d.지역))].sort();
            const majors = [...new Set(fullData.map(d => d.계열))].sort();
            const universities = [...new Set(fullData.map(d => d.학교명))].sort();
            const departments = [...new Set(fullData.map(d => d.학과))].sort();

            populateSelect('regionFilter', regions);
            populateSelect('majorFilter', majors);
            populateSelect('universityFilter', universities);
            populateSelect('departmentFilter', departments);
        }

        function populateSelect(id, items, clearFirst = true) {
            const select = document.getElementById(id);
            if (clearFirst) {
                // 'all' 옵션을 제외하고 모두 제거
                while (select.options.length > 1) {
                    select.remove(1);
                }
            }
            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item;
                option.textContent = item;
                select.appendChild(option);
            });
        }

        // 계열 필터 업데이트 (지역 변경 시)
        function updateMajorFilter() {
            const region = document.getElementById('regionFilter').value;
            let filteredData = fullData;
            
            if (region !== 'all') {
                filteredData = filteredData.filter(d => d.지역 === region);
            }
            
            const majors = [...new Set(filteredData.map(d => d.계열))].sort();
            const currentMajor = document.getElementById('majorFilter').value;
            
            populateSelect('majorFilter', majors);
            
            // 현재 선택된 계열이 새로운 목록에 있으면 유지, 없으면 'all'로 설정
            if (majors.includes(currentMajor)) {
                document.getElementById('majorFilter').value = currentMajor;
            } else {
                document.getElementById('majorFilter').value = 'all';
            }
            
            // 하위 필터들도 업데이트
            updateUniversityFilter();
        }

        // 대학 필터 업데이트 (지역, 계열 변경 시)
        function updateUniversityFilter() {
            const region = document.getElementById('regionFilter').value;
            const major = document.getElementById('majorFilter').value;
            let filteredData = fullData;
            
            if (region !== 'all') {
                filteredData = filteredData.filter(d => d.지역 === region);
            }
            if (major !== 'all') {
                filteredData = filteredData.filter(d => d.계열 === major);
            }
            
            const universities = [...new Set(filteredData.map(d => d.학교명))].sort();
            const currentUniversity = document.getElementById('universityFilter').value;
            
            populateSelect('universityFilter', universities);
            
            // 현재 선택된 대학이 새로운 목록에 있으면 유지, 없으면 'all'로 설정
            if (universities.includes(currentUniversity)) {
                document.getElementById('universityFilter').value = currentUniversity;
            } else {
                document.getElementById('universityFilter').value = 'all';
            }
            
            // 하위 필터도 업데이트
            updateDepartmentFilter();
        }

        // 학과 필터 업데이트 (지역, 계열, 대학 변경 시)
        function updateDepartmentFilter() {
            const region = document.getElementById('regionFilter').value;
            const major = document.getElementById('majorFilter').value;
            const university = document.getElementById('universityFilter').value;
            let filteredData = fullData;
            
            if (region !== 'all') {
                filteredData = filteredData.filter(d => d.지역 === region);
            }
            if (major !== 'all') {
                filteredData = filteredData.filter(d => d.계열 === major);
            }
            if (university !== 'all') {
                filteredData = filteredData.filter(d => d.학교명 === university);
            }
            
            const departments = [...new Set(filteredData.map(d => d.학과))].sort();
            const currentDepartment = document.getElementById('departmentFilter').value;
            
            populateSelect('departmentFilter', departments);
            
            // 현재 선택된 학과가 새로운 목록에 있으면 유지, 없으면 'all'로 설정
            if (departments.includes(currentDepartment)) {
                document.getElementById('departmentFilter').value = currentDepartment;
            } else {
                document.getElementById('departmentFilter').value = 'all';
            }
        }

        // 데이터 필터링
        function filterData() {
            const region = document.getElementById('regionFilter').value;
            const major = document.getElementById('majorFilter').value;
            const university = document.getElementById('universityFilter').value;
            const department = document.getElementById('departmentFilter').value;

            currentData = fullData.filter(d => {
                return (region === 'all' || d.지역 === region) &&
                       (major === 'all' || d.계열 === major) &&
                       (university === 'all' || d.학교명 === university) &&
                       (department === 'all' || d.학과 === department);
            });

            updateStats();
            updateCharts();
        }

        // 통계 업데이트
        function updateStats() {
            if (currentData.length === 0) {
                document.getElementById('avgRate').textContent = '0%';
                document.getElementById('maxRate').textContent = '0%';
                document.getElementById('minRate').textContent = '0%';
                document.getElementById('totalCount').textContent = '0';
                return;
            }

            const rates = currentData.map(d => d.취업률);
            const avg = (rates.reduce((a, b) => a + b, 0) / rates.length).toFixed(1);
            const max = Math.max(...rates).toFixed(1);
            const min = Math.min(...rates).toFixed(1);

            document.getElementById('avgRate').textContent = avg + '%';
            document.getElementById('maxRate').textContent = max + '%';
            document.getElementById('minRate').textContent = min + '%';
            document.getElementById('totalCount').textContent = currentData.length;
        }

        // 차트 업데이트
        function updateCharts() {
            updateMajorChart();
            updateRegionChart();
            updateUniversityChart();
            updateDepartmentChart();
        }

        // 계열별 차트
        function updateMajorChart() {
            if (majorChart) {
                majorChart.destroy();
            }

            if (currentData.length === 0) return;

            const majorData = {};
            currentData.forEach(d => {
                if (!majorData[d.계열]) majorData[d.계열] = [];
                majorData[d.계열].push(d.취업률);
            });

            const labels = Object.keys(majorData);
            const data = labels.map(major => {
                const rates = majorData[major];
                return parseFloat((rates.reduce((a, b) => a + b, 0) / rates.length).toFixed(1));
            });

            const ctx = document.getElementById('majorChart').getContext('2d');
            majorChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '평균 취업률 (%)',
                        data: data,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        borderRadius: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: context => '평균 취업률: ' + context.parsed.y + '%'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: value => value + '%'
                            }
                        }
                    }
                }
            });
        }

        // 지역별 차트
        function updateRegionChart() {
            if (regionChart) {
                regionChart.destroy();
            }

            if (currentData.length === 0) return;

            const regionData = {};
            currentData.forEach(d => {
                if (!regionData[d.지역]) regionData[d.지역] = [];
                regionData[d.지역].push(d.취업률);
            });

            const labels = Object.keys(regionData);
            const data = labels.map(region => {

                return parseFloat((rates.reduce((a, b) => a + b, 0) / rates.length).toFixed(1));

            const colors = [

                options: {
                    responsive: true,

                            callbacks: {
                                label: context => context.label + ': ' + context.parsed + '%'

        // 대학별 차트
        function updateUniversityChart() {
            if (universityChart) {
                universityChart.destroy();

            if (currentData.length === 0) return;

            const universityData = {};
            currentData.forEach(d => {
                if (!universityData[d.학교명]) universityData[d.학교명] = [];

                                    size: 10
                                }
                            }
                        }
                    }
                }
            });
        }

        // 학과별 차트
        function updateDepartmentChart() {
            // 이전 차트가 있으면 제거
            if (departmentChart) {
                try {
                    departmentChart.destroy();
                } catch (e) {
                    console.error('차트 제거 중 오류:', e);
                }
                departmentChart = null;
            }

            const ctx = document.getElementById('departmentChart');
            if (!ctx) {
                console.error('departmentChart canvas를 찾을 수 없습니다');
                return;
            }

            if (currentData.length === 0) {
                // 데이터가 없을 때 빈 차트 표시
                departmentChart = new Chart(ctx.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: ['데이터 없음'],
                        datasets: [{
                            label: '평균 취업률 (%)',
                            data: [0],
                            backgroundColor: 'rgba(200, 200, 200, 0.5)',
                            borderColor: 'rgba(200, 200, 200, 1)',
                            borderWidth: 2,
                            borderRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        indexAxis: 'y',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: context => '데이터 없음'
                                }
                            }
                        },
                        scales: {
                            x: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    callback: value => value + '%'
                                }
                            }
                        }
                    }
                });
                return;
            }

            const departmentData = {};
            currentData.forEach(d => {
                if (d.학과 && d.취업률 !== undefined && !isNaN(d.취업률)) {
                    if (!departmentData[d.학과]) departmentData[d.학과] = [];
                    departmentData[d.학과].push(d.취업률);
                }
            });

            // 평균 취업률로 정렬하고 상위 20개만 표시
            const sortedDepartments = Object.keys(departmentData)
                .map(department => {
                    const rates = departmentData[department];
                    const avg = rates.reduce((a, b) => a + b, 0) / rates.length;
                    return { department, avg };
                })
                .sort((a, b) => b.avg - a.avg)
                .slice(0, 20);

            // 데이터가 없으면 빈 차트 표시
            if (sortedDepartments.length === 0) {
                departmentChart = new Chart(ctx.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: ['데이터 없음'],
                        datasets: [{
                            label: '평균 취업률 (%)',
                            data: [0],
                            backgroundColor: 'rgba(200, 200, 200, 0.5)',
                            borderColor: 'rgba(200, 200, 200, 1)',
                            borderWidth: 2,
                            borderRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        indexAxis: 'y',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: context => '데이터 없음'
                                }
                            }
                        },
                        scales: {
                            x: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    callback: value => value + '%'
                                }
                            }
                        }
                    }
                });
                return;
            }

            const labels = sortedDepartments.map(d => d.department);
            const data = sortedDepartments.map(d => parseFloat(d.avg.toFixed(1)));

            // 차트 생성
            try {
                departmentChart = new Chart(ctx.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '평균 취업률 (%)',
                            data: data,
                            backgroundColor: 'rgba(153, 102, 255, 0.8)',
                            borderColor: 'rgba(153, 102, 255, 1)',
                            borderWidth: 2,
                            borderRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        indexAxis: 'y',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: context => '평균 취업률: ' + context.parsed.x + '%'
                                }
                            }
                        },
                        scales: {
                            x: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    callback: value => value + '%'
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('차트 생성 중 오류:', error);
            }
        }

        // 초기화
        fullData = parseCSV(rawCSV);
        currentData = fullData;
        initializeFilters();
        updateStats();
        updateCharts();

        // 이벤트 리스너
        // 지역 변경 시: 계열, 대학, 학과 필터 업데이트
        document.getElementById('regionFilter').addEventListener('change', function() {
            updateMajorFilter();
            filterData();
        });
        
        // 계열 변경 시: 대학, 학과 필터 업데이트
        document.getElementById('majorFilter').addEventListener('change', function() {
            updateUniversityFilter();
            filterData();
        });
        
        // 대학 변경 시: 학과 필터 업데이트
        document.getElementById('universityFilter').addEventListener('change', function() {
            updateDepartmentFilter();
            filterData();
        });
        
        // 학과 변경 시: 데이터 필터링만 수행
        document.getElementById('departmentFilter').addEventListener('change', filterData);
    </script>
</body>
</html>
